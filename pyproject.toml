[project]
name = "fleet-platform"
version = "0.1.0"
description = "Comprehensive Logistics and Fleet Management Platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "streamlit>=1.32",
    "plotly>=5.20",
    "joblib>=1.3",
    "python-docx>=1.1",
    "nbformat>=5.9",
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "matplotlib>=3.8",
    "kaleido>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
